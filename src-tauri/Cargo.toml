[package]
name = "video-downloader"
version = "1.0.0"
description = "A minimal desktop downloader for public videos"
authors = ["junaidsultanxyz <contact@junaidsultan.com>"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/junaidsultanxyz/video-downloader"
homepage = "https://github.com/junaidsultanxyz/video-downloader"
keywords = ["video", "downloader", "yt-dlp", "ffmpeg", "tauri"]
categories = ["multimedia::video"]

# The library is what Tauri actually runs; main.rs is a thin launcher that
# calls into it. This split is what lets the same code target mobile later.
[lib]
name = "video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unix signal delivery (SIGSTOP/SIGCONT/SIGKILL) for pause, resume and cancel.
# yt-dlp is a PyInstaller one-file binary that forks a worker child, so these
# have to reach the whole process tree, not just the process we spawned.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows has no signals, so pause/resume suspend and resume the threads of
# every process in the yt-dlp tree, walked via the ToolHelp snapshot APIs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# A downloader is I/O-bound, not compute-bound, so we optimise the release
# build purely for a small binary: size-tuned codegen, fat LTO, one codegen
# unit, aborting panics (no unwinding tables), and stripped symbols.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
