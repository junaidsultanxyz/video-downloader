<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Downloader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header: wordmark + engine status -->
      <header class="header">
        <span class="wordmark">VIDEO DOWNLOADER</span>
        <div class="header-controls">
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            title="Toggle dark mode"
            aria-label="Toggle dark mode"
          >
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          </button>
          <button
            id="engine"
            class="engine"
            type="button"
            title="Update the download engine"
          >
            <span class="engine-dot"></span>
            <span id="engine-label" class="engine-label">checking engine…</span>
          </button>
        </div>
      </header>

      <main class="main">
        <!-- Source: paste a link -->
        <section class="source" aria-label="Source">
          <div class="well">
            <input
              id="url"
              class="url"
              type="url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="Paste a link"
              aria-label="Paste a link"
            />
            <button id="fetch" class="btn btn-primary" type="button">Fetch</button>
          </div>

          <p class="supported">
            Supports YouTube, Instagram, Facebook and TikTok — public posts only.
          </p>

          <!-- Skeleton shown while probing -->
          <div id="skeleton" class="preview skeleton" hidden>
            <div class="skel-thumb"></div>
            <div class="skel-lines">
              <div class="skel-line"></div>
              <div class="skel-line short"></div>
              <div class="skel-chips">
                <div class="skel-chip"></div>
                <div class="skel-chip"></div>
                <div class="skel-chip"></div>
              </div>
            </div>
          </div>

          <!-- Probe error -->
          <div id="probe-error" class="probe-error" hidden></div>

          <!-- Preview card, filled by main.js -->
          <div id="preview" class="preview" hidden></div>
        </section>

        <!-- Queue -->
        <section class="queue" aria-label="Queue">
          <div class="eyebrow-row">
            <span class="eyebrow">Queue</span>
            <span id="active-count" class="eyebrow active-count">0 active</span>
          </div>
          <div id="empty" class="empty">
            Nothing queued yet. Paste a link above to start.
          </div>
          <ol id="queue-list" class="queue-list"></ol>
        </section>
      </main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
