name: release

# Build installers for every supported platform and attach them to a GitHub
# release. Trigger by pushing a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
# or run it by hand from the Actions tab, giving a tag name.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

# tauri-action creates the release and uploads the installers to it.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # Linux builds the rpm (Fedora) and AppImage (Arch / any glibc distro);
        # Windows builds the NSIS installer. macOS is out of scope for Sluice.
        # ubuntu-22.04 keeps the AppImage's glibc requirement low. Each runner is
        # told exactly which bundles to make so it never tries one that does not
        # belong to its OS (the config lists all three for local builds).
        include:
          - os: ubuntu-22.04
            bundles: rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The yt-dlp and ffmpeg sidecars are not committed; fetch them per host so
      # Tauri can bundle them. Needs Rust on PATH (the scripts read the triple).
      - name: Fetch sidecars (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-binaries.sh

      - name: Fetch sidecars (Windows)
        if: runner.os == 'Windows'
        run: pwsh -ExecutionPolicy Bypass -File scripts/fetch-binaries.ps1

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub runners lack FUSE 2, which the AppImage tooling needs; this
          # makes those tools extract-and-run instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          # No package.json in this project, so point the action at the CLI.
          tauriScript: npx --yes @tauri-apps/cli@^2
          # Build only the bundles that belong to this runner's OS.
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Sluice ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Download the installer for your platform:

            - Fedora: `.rpm` (or use the AppImage if it conflicts with a system ffmpeg)
            - Arch or other Linux: `.AppImage` (`chmod +x`, then run)
            - Windows: `-setup.exe`
          releaseDraft: true
          prerelease: false
