name: release

# Build installers for every supported platform and attach them to a GitHub
# release. Trigger by pushing a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
# or run it by hand from the Actions tab, giving a tag name.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

# tauri-action creates the release and uploads the installers to it.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # Linux builds the rpm (Fedora) and AppImage (Arch / any glibc distro);
        # Windows builds the NSIS installer. macOS is out of scope here.
        # ubuntu-22.04 keeps the AppImage's glibc requirement low. Each runner is
        # told exactly which bundles to make so it never tries one that does not
        # belong to its OS (the config lists all three for local builds).
        include:
          - os: ubuntu-22.04
            bundles: rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The yt-dlp and ffmpeg sidecars are not committed; fetch them per host so
      # Tauri can bundle them. Needs Rust on PATH (the scripts read the triple).
      - name: Fetch sidecars (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-binaries.sh

      - name: Fetch sidecars (Windows)
        if: runner.os == 'Windows'
        run: pwsh -ExecutionPolicy Bypass -File scripts/fetch-binaries.ps1

      # Linux builds the rpm and AppImage as two separate invocations, not the
      # combined `--bundles rpm,appimage` tauri-action normally does in one
      # shot, because the two need different bundle.externalBin: the rpm must
      # NOT bundle ffmpeg (it ships /usr/bin/ffmpeg, which file-conflicts with
      # Fedora's own ffmpeg-free package and makes the rpm uninstallable), while
      # the AppImage must stay fully self-contained. The rpm.conf.json override
      # drops ffmpeg from externalBin, adds a `(ffmpeg-free or ffmpeg)` runtime
      # dependency instead, ships a proper AppStream metainfo file (without one,
      # GNOME Software cannot tell this package apart from an unrelated Flathub
      # app that happens to share the generic name "Video Downloader", and
      # shows that app's listing instead), and fills in the desktop file's
      # Categories, which Tauri's default template leaves empty.
      - name: Build rpm (Linux)
        if: runner.os == 'Linux'
        run: npx --yes @tauri-apps/cli@^2 build --bundles rpm --config packaging/linux/rpm.conf.json

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # GitHub runners lack FUSE 2, which the AppImage tooling needs; this
          # makes those tools extract-and-run instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage

      - name: Publish Linux release assets
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Download the installer for your platform:

            - Fedora: `.rpm`
            - Arch or other Linux: `.AppImage` (`chmod +x`, then run)
            - Windows: `-setup.exe`
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # The Windows job (still on tauri-action) may create this same release
          # in parallel; `create` failing because it already exists is fine,
          # upload only needs the release to exist by the time it runs.
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Video Downloader $tag" \
            --notes "$RELEASE_NOTES" \
            --draft || true
          gh release upload "$tag" \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Build and publish release (Windows)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No package.json in this project, so point the action at the CLI.
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Video Downloader ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Download the installer for your platform:

            - Fedora: `.rpm`
            - Arch or other Linux: `.AppImage` (`chmod +x`, then run)
            - Windows: `-setup.exe`
          releaseDraft: true
          prerelease: false
